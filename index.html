const $=s=>document.querySelector(s);
const LS=C.key+'-v4';
let state={route:'avui',tab:'prov',q:'',chip:'all'};
let D; // decisions
try{D=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){D={}}
function saveD(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function go(r,x){state.route=r;if(x&&x.tab)state.tab=x.tab;closeDr();render();window.scrollTo(0,0)}
function navHTML(a){const pend=C.aps.filter(x=>!D[x.id]).length;
 return a.map(([k,t])=>`<a class="${state.route===k?'on':''}" onclick="go('${k}')">${t}${k==='aprovacions'&&pend?`<span class="n">${pend}</span>`:''}</a>`).join('')}
function nav(){$('#side').innerHTML=`<div class="brand"><img src="${C.logo}" alt="${C.name}"><small>ASSISTENT DE COMPRES</small></div>${navHTML(C.nav)}<div class="side-foot">Res no s'envia ni s'actualitza sense aprovació.<br><br><b>Demo independent</b>, no és un producte oficial de ${C.name}. Dades fictícies.</div>`;
 $('#mob').innerHTML=navHTML(C.nav.filter(([k])=>k!=='mes').concat([['mes','Més']]));}
function sup(id){return C.sups[id]||{n:id,c:'',cat:''}}
function ord(id){return C.orders.find(o=>o.id===id)}
function recvPct(o){const q=o.L.reduce((a,l)=>a+l.q,0),r=o.L.reduce((a,l)=>a+l.r,0);return q?Math.round(r/q*100):0}
function ordState(o){const today=C.today,p=recvPct(o);if(p===100)return['Rebuda','t-grn'];const ref=o.cd||o.pd;if(ref<today)return['En retard','t-red'];if(o.cd&&o.cd>o.pd)return['Reprogramada','t-amb'];if(p>0)return['Parcial','t-amb'];if(!o.cd)return['Sense confirmar','t-gry'];return['Confirmada','t-blu']}
function fmtD(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function decided(id){return D[id]}
function kpi(label,val,cls){return `<div class="card kpi ${cls||''}"><b>${val}</b><span>${label}</span></div>`}

function vOpcions(){

/* ---------- AVUI ---------- */
function vAvui(){const pend=C.aps.filter(a=>!D[a.id]);const open=C.orders.filter(o=>recvPct(o)<100).length;const part=C.orders.filter(o=>recvPct(o)>0&&recvPct(o)<100).length;
 let h=`<div class="heading"><h1>Bon dia, ${C.contact}</h1><div class="sub">${C.tagline} Res no s'envia ni es registra sense la teva aprovació.</div></div>`;
 h+=`<div class="grid ${C.of?'k4':'k3'}" style="margin-bottom:14px">${kpi('Aprovacions pendents',pend.length,pend.length?'warn':'')}${kpi('Comandes obertes',open)}${kpi('Recepcions parcials',part)}${C.of?kpi('Ordres de fabricació en risc',C.of.filter(o=>o.risk).length,C.of.some(o=>o.risk)?'bad':''):''}</div>`;
 if(C.alert)h+=`<div class="banner ${C.alert.cls||''}"><span class="dot ${C.alert.cls==='amber'?'d-amb':'d-red'}" style="margin-top:4px"></span><div><b>${esc(C.alert.t)}</b><br>${esc(C.alert.d)} <a href="#" onclick="go('${C.alert.go}');return false" style="color:var(--navy);font-weight:600">${esc(C.alert.link)}</a></div></div>`;
 h+=`<div class="grid two"><div class="card"><h2>Decisions pendents</h2>`;
 if(!pend.length)h+=`<div class="empty">Tot decidit. Quan entri un correu o canvii una data, la proposta apareixerà aquí.</div>`;
 pend.slice(0,3).forEach(a=>{h+=`<div class="item"><span class="dot ${a.side==='produccio'?'d-blu':a.urg?'d-red':'d-amb'}"></span><div class="b"><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Producció':'Compres'}</span>`:''}<div style="margin-top:4px"><b>${esc(a.title)}</b></div><div class="small mut">${esc(a.brief)}</div></div><button class="btn ghost" onclick="go('aprovacions');setTimeout(()=>openAp('${a.id}'),60)">Revisar</button></div>`});
 h+=`</div><div class="card"><h2>Agenda de la setmana</h2>${C.agenda.map(a=>`<div class="item"><span class="dot d-gry"></span><div class="b"><b>${esc(a[0])}</b><div class="small mut">${esc(a[1])}</div></div><span class="small mut" style="white-space:nowrap">${esc(a[2])}</span></div>`).join('')}</div></div>`;
 $('#view').innerHTML=h}

const TYPE_TAG={'Seguiment':'t-amb','Canvi de data':'t-red','Factura':'t-red','Recepció':'t-blu','Substitució':'t-amb','Documentació':'t-amb','Preu':'t-red','Comanda nova':'t-grn','Sincronització':'t-blu','Reclamació':'t-red'};
function vApprov(){const pend=C.aps.filter(a=>!D[a.id]);const done=C.aps.filter(a=>D[a.id]);
 let h=`<div class="heading"><h1>Aprovacions</h1><div class="sub">El sistema prepara i proposa; tu decideixes cas per cas. Aprovar registra la decisió a l'historial. En aquesta demo no s'envia res.</div></div>`;

 pend.forEach(a=>{const o=ord(a.order);h+=`<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:230px"><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Decideix producció':'Decideix compres'}</span>`:''}${a.urg?' <span class="tag t-red">Urgent</span>':''}<h3 style="margin:8px 0 4px;font-size:15px">${esc(a.title)}</h3><div class="small mut">${o?esc(o.id)+(o.proj?` · ${esc(o.proj)}`:'')+(a.of?` · ${a.of}`:''):''}</div><div class="why"><b>Per què ho proposa:</b> ${esc(a.why)}</div></div><button class="btn" onclick="openAp('${a.id}')">Revisar i decidir</button></div></div>`});
 if(done.length){h+=`<div class="card"><h2>Registre de decisions</h2>${done.map(a=>{const d=D[a.id];return `<div class="item"><span class="dot ${d.action==='aprovada'?'d-grn':'d-red'}"></span><div class="b"><b>${esc(a.title)}</b><div class="small"><span class="dec ${d.action==='aprovada'?'':'rej'}">${d.action==='aprovada'?'Aprovada':'Rebutjada'}</span> · ${d.ts}${d.note?` · ${esc(d.note)}`:''}</div></div><button class="btn ghost" onclick="undoAp('${a.id}')">Desfés</button></div>`}).join('')}</div>`}
 $('#view').innerHTML=h}
function openAp(id){const a=C.aps.find(x=>x.id===id);if(!a)return;const o=ord(a.order);const d=D[id];
 let h=`<button class="x" onclick="closeDr()">×</button><span class="tag ${TYPE_TAG[a.type]||'t-gry'}">${a.type}</span>${a.side?` <span class="tag t-blu">${a.side==='produccio'?'Decideix producció':'Decideix compres'}</span>`:''}<h2 style="margin:10px 0 4px">${esc(a.title)}</h2>`;
 if(o)h+=`<div class="kv"><div>Comanda</div><div><a href="#" onclick="closeDr();openOrder('${o.id}');return false" style="color:var(--navy)">${o.id}</a>${o.proj?` · ${esc(o.proj)}`:''}</div><div>Proveïdor</div><div>${esc(sup(o.s).n)}</div><div>Promesa</div><div>${fmtD(o.pd)}${o.cd?` → confirmada ${fmtD(o.cd)}`:' (sense confirmar)'}</div></div>`;
 h+=`<div class="why"><b>Per què ho proposa:</b> ${esc(a.why)}</div>`;
 if(a.opts){h+=`<h3>Opcions</h3>${a.opts.map((op,i)=>`<label style="display:block;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer"><input type="radio" name="opt" value="${i}" ${i===0?'checked':''} style="margin-right:8px"><b>${esc(op.t)}</b><br><span class="small mut" style="margin-left:24px">${esc(op.d)}</span></label>`).join('')}`}
 if(a.draft)h+=`<h3 style="margin-top:18px">Esborrany preparat (editable)</h3><div class="mailprev"><div class="mh">Per a: ${esc(a.draft.to)}<br>Assumpte: ${esc(a.draft.subj)}</div><textarea id="draftbody">${esc(a.draft.body)}</textarea></div><div style="margin-top:8px"><button class="btn soft" onclick="copyDraft()">Copia el text</button> <span class="small mut">El peguem al teu correu de sempre. Cap programa nou de correu.</span></div>`;
 if(d){h+=`<div class="act"><span class="dec ${d.action==='aprovada'?'':'rej'}">${d.action==='aprovada'?'Aprovada':'Rebutjada'} · ${d.ts}${d.note?' · '+esc(d.note):''}</span><button class="btn ghost" onclick="undoAp('${a.id}')">Desfés</button></div>`}
 else{h+=`<div class="act"><button class="btn" onclick="decideAp('${a.id}','aprovada')">Aprova${a.draft?' i marca per enviar':''}</button>${a.draft?`<button class="btn soft" onclick="decideAp('${a.id}','aprovada',true)">Aprova amb l'edició</button>`:''}<button class="btn ghost" onclick="rejectAsk('${a.id}')">Rebutja</button></div><div class="small mut" style="margin-top:8px">Simulació: aprovar no envia correus ni escriu a cap ERP; només registra la decisió.</div>`}
 $('#pn').innerHTML=h;$('#dr').classList.add('on')}
function rejectAsk(id){$('#pn').insertAdjacentHTML('beforeend',`<div id="rejbox" style="margin-top:14px"><h3>Motiu del rebuig</h3><input id="rejnote" style="width:100%" placeholder="Opcional"><div class="act"><button class="btn" onclick="decideAp('${id}','rebutjada')">Confirma el rebuig</button></div></div>`);$('#rejbox').scrollIntoView({behavior:'smooth'})}
function decideAp(id,action,edited){const a=C.aps.find(x=>x.id===id);let note='';const rj=$('#rejnote');if(rj&&rj.value)note=rj.value;
 const opt=document.querySelector('input[name=opt]:checked');if(opt&&a.opts)note=(note?note+' · ':'')+'Opció: '+a.opts[Number(opt.value)].t;
 if(edited){const tb=$('#draftbody');if(tb)note=(note?note+' · ':'')+'Amb edició manual de l’esborrany'}
 D[id]={action,ts:new Date().toLocaleString('ca-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),note};saveD();closeDr();
 toast(action==='aprovada'?'Decisió aprovada i registrada (simulada, no s’ha enviat res)':'Proposta rebutjada');render()}
function undoAp(id){delete D[id];saveD();closeDr();toast('Decisió desfeta');render()}

/* ---------- COMANDES ---------- */
function vOrders(){let h=`<div class="heading"><h1>Comandes</h1><div class="sub">Lectura de les comandes obertes. El detall mostra l'historial i permet preparar un seguiment, que sempre passa per aprovació.</div></div>`;
 h+=`<div class="tools"><input type="search" placeholder="Cerca per comanda, proveïdor o referència" value="${esc(state.q)}" oninput="state.q=this.value;vOrdersBody()"><span id="chips">${[['all','Totes'],['late','En retard'],['part','Parcials'],['noc','Sense confirmar']].map(([k,t])=>`<button class="chip ${state.chip===k?'on':''}" onclick="state.chip='${k}';vOrdersBody()">${t}</button>`).join('')}</span></div><div class="card tw" id="ot"></div>`;
 $('#view').innerHTML=h;vOrdersBody()}
function vOrdersBody(){const q=state.q.toLowerCase();const rows=C.orders.filter(o=>{const st=ordState(o)[1];if(state.chip==='late'&&st!=='t-red')return false;if(state.chip==='part'&&recvPct(o)===0||state.chip==='part'&&recvPct(o)===100)return false;if(state.chip==='noc'&&o.cd)return false;
 if(q&&!(o.id+' '+sup(o.s).n+' '+o.L.map(l=>l.ref+' '+l.d).join(' ')).toLowerCase().includes(q))return false;return true});
 $('#ot').innerHTML=`<table class="cmdt"><thead><tr><th>Comanda</th><th>Proveïdor</th>${C.of?'<th>OF</th>':''}<th class="hide-m">Promesa</th><th class="hide-m">Confirmada</th><th>Estat</th><th>Rebut</th></tr></thead><tbody>${rows.map(o=>{const[st,cl]=ordState(o);const p=recvPct(o);return `<tr class="row" onclick="openOrder('${o.id}')"><td>${o.id}${o.proj?`<div class="small mut">${esc(o.proj)}</div>`:''}</td><td>${esc(sup(o.s).n)}</td>${C.of?`<td>${o.of||'—'}</td>`:''}<td class="hide-m">${fmtD(o.pd)}</td><td class="hide-m">${o.cd?fmtD(o.cd):'—'}</td><td><span class="tag ${cl}">${st}</span></td><td><div class="bar ${st==='En retard'?'risk':''}"><i style="width:${p}%"></i></div><span class="small mut">${p}%</span></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Cap comanda amb aquests filtres.</td></tr>'}</tbody></table>`}
function openOrder(id){const o=ord(id);if(!o)return;const[st,cl]=ordState(o);const s=sup(o.s);
 let h=`<button class="x" onclick="closeDr()">×</button><span class="tag ${cl}">${st}</span><h2 style="margin:10px 0 2px">${o.id}${o.proj?` · ${esc(o.proj)}`:''}</h2><div class="mut small">${esc(s.n)} · ${esc(s.cat)} · contacte: ${esc(s.c)}</div>`;
 h+=`<div class="kv"><div>Emesa</div><div>${fmtD(o.od)}</div><div>Promesa</div><div>${fmtD(o.pd)}</div><div>Confirmada</div><div>${o.cd?fmtD(o.cd):'No confirmada'}</div>${o.of?`<div>Ordre de fabricació</div><div>${esc(o.of)}</div>`:''}${o.imp?`<div>Impacte</div><div>${esc(o.imp)}</div>`:''}</div>`;
 h+=`<h3>Línies</h3><table><thead><tr><th>Ref.</th><th>Descripció</th><th>Qt.</th><th>Rebut</th></tr></thead><tbody>${o.L.map(l=>`<tr><td class="mono small">${esc(l.ref)}</td><td>${esc(l.d)}</td><td>${l.q}</td><td><div class="bar"><i style="width:${l.q?Math.round(l.r/l.q*100):0}%"></i></div><span class="small mut">${l.r}/${l.q}</span></td></tr>`).join('')}</tbody></table>`;
 h+=`<h3 style="margin-top:18px">Historial</h3><ul class="tl">${o.ev.map(e=>`<li><span class="mut small">${fmtD(e[0])} · ${esc(e[1])}</span><br>${esc(e[2])}</li>`).join('')}</ul>`;
 h+=`<div class="act"><button class="btn ghost" onclick="mkFollow('${o.id}')">Prepara un seguiment</button></div><div class="small mut" style="margin-top:6px">El seguiment no s'envia: crea una proposta a Aprovacions.</div>`;
 $('#pn').innerHTML=h;$('#dr').classList.add('on')}
function mkFollow(id){const o=ord(id);const s=sup(o.s);const newId='ap-x-'+id;
 if(!C.aps.some(a=>a.id===newId)){C.aps.unshift({id:newId,type:'Seguiment',order:id,title:'Seguiment de la '+id+' ('+s.n+')',brief:'Proposta creada des del detall de la comanda.',why:'Preparada manualment des de la comanda. Sense confirmació actualitzada, el pla queda en risc.',draft:{to:s.c+' <comercial@proveidor-demo.example>',subj:'Estat de la comanda '+id,body:'Bon dia '+s.c.split(' ')[0]+',\n\nEns podeu confirmar l’estat de la comanda '+id+' i la data d’entrega actualitzada?\n\nGràcies,\n'+C.contact+'\n'+C.name+' (demo)'}})}
 closeDr();go('aprovacions');setTimeout(()=>openAp(newId),80)}

 C.of.forEach(f=>{const pct=f.ready;const haves=f.lines.filter(l=>l.st==='Rebut').length;
  h+=`<div class="card ofcard" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h3 style="margin:0 0 2px;font-size:15px">${f.id} · ${esc(f.machine)}</h3><div class="small mut">${esc(f.sector)} · inici previst ${esc(f.start)} · lliurament ${esc(f.due)}</div></div>${f.risk?'<span class="tag t-red">En risc</span>':'<span class="tag t-grn">En marxa</span>'}</div><div style="display:flex;align-items:center;gap:10px;margin:12px 0 4px"><div class="bar ${f.risk?'risk':''}" style="flex:1"><i style="width:${pct}%"></i></div><span class="small mut">${pct}% material rebut</span></div><ul>${f.lines.map(l=>`<li class="small"><span class="tag ${l.st==='Rebut'?'t-grn':l.st==='Risc'?'t-red':'t-amb'}">${l.st}</span> ${esc(l.need)} <span class="mut">· ${esc(l.info)}</span></li>`).join('')}</ul>`;
  if(f.ap){const a=C.aps.find(x=>x.id===f.ap);if(a&&!D[a.id])h+=`<div class="act"><button class="btn" onclick="go('aprovacions');setTimeout(()=>openAp('${a.id}'),60)">Revisar la proposta de sincronització</button></div>`;else if(a&&D[a.id])h+=`<div class="small dec">${D[a.id].action==='aprovada'?'Sincronització aprovada':'Proposta rebutjada'} · ${D[a.id].ts}</div>`}
  h+=`</div>`});
 h+=`<div class="card"><h2>Com s'actualitza</h2><p class="small mut" style="margin:0">Les recepcions i les dates confirmades de compres alimenten aquesta vista. Cap canvi de planning s'aplica sol: la proposta arriba a Aprovacions i la persona de compres o de producció decideix.</p></div>`;
 $('#view').innerHTML=h}

function vMes(){const t=state.tab;let h=`<div class="heading"><h1>Més</h1></div><div class="tabs">${[['prov','Proveïdors'],['ctx','Context públic'],['real','Què és real']].map(([k,tt])=>`<button class="${t===k?'on':''}" onclick="state.tab='${k}';render()">${tt}</button>`).join('')}</div><div id="mb"></div>`;

 if(t==='prov'){mb.innerHTML=`<div class="card tw"><table><thead><tr><th>Proveïdor</th><th>Àrea</th><th>Contacte</th><th class="hide-m">Termini hab. (dies)</th></tr></thead><tbody>${Object.values(C.sups).map(s=>`<tr><td>${esc(s.n)}</td><td>${esc(s.cat)}</td><td>${esc(s.c)}</td><td class="hide-m">${s.lt}</td></tr>`).join('')}</tbody></table><p class="small mut">Noms i terminis ficticis per a la demo.</p></div>`}
 else if(t==='ctx'){mb.innerHTML=`<div class="grid two"><div class="card"><h2>${esc(C.ctx.whoT)}</h2>${C.ctx.who.map(p=>`<p class="small" style="margin:8px 0">${p}</p>`).join('')}<h3 style="margin-top:14px">Declaracions públiques i límits</h3>${C.ctx.reviews.map(p=>`<p class="small" style="margin:8px 0">${p}</p>`).join('')}</div><div class="card"><h2>Per què aquesta demo</h2>${C.ctx.fit.map(p=>`<p class="small" style="margin:8px 0">${p}</p>`).join('')}<h3 style="margin-top:14px">Fonts públiques</h3><ul class="src-list small">${C.ctx.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul><p class="small mut">Demo independent, no és un producte oficial de ${C.name}. Logotip públic usat només per a aquesta presentació.</p></div></div>`}
 else{mb.innerHTML=`<div class="card"><h2>Què és real i què és simulat</h2><ul><li><b>Real:</b> interfície, navegació, filtres i registre de decisions al navegador.</li><li><b>Simulat:</b> classificació de correus, esborranys, recepcions, ERP i qualsevol enviament.</li><li><b>Desconnectat:</b> correu, ERP, documents, IA i pagaments.</li><li>Tots els proveïdors, contactes operatius, comandes, ordres de fabricació i xifres són ficticis.</li><li>Cap xifra de la demo és una dada real de ${C.name} ni una promesa d'estalvi.</li></ul><p class="small">El flux és manual per disseny: el sistema classifica, vincula i prepara; la persona aprova, edita o rebutja cada acció. L'automatització total no és l'objectiu d'aquesta proposta.</p><div class="act"><button class="btn ghost" onclick="resetAll()">Reinicia la demo</button></div></div>`}}

function closeDr(){$('#dr').classList.remove('on')}
function render(){nav();$('#tl').src=C.logo;({avui:vAvui,aprovacions:vApprov,comandes:vOrders,produccio:vProd,mes:vMes,expedient:vExpedient,opcions:vOpcions,confirmacions:vConfirmacions}[state.route]||vAvui)()}
$('#dr').addEventListener('click',e=>{if(e.target.id==='dr')closeDr()});
/* Operational workbench, own implementation based on purchasing software patterns. */
let queueMode='pending',queueQ='',selectedAp=null,selectedOf=null;
try{const custom=JSON.parse(localStorage.getItem(LS+'-custom')||'[]');custom.forEach(a=>{if(!C.aps.some(x=>x.id===a.id))C.aps.push(a)})}catch(e){}
function draftGet(id){try{return JSON.parse(localStorage.getItem(LS+'-draft-'+id)||'null')}catch(e){return null}}
function activeReview(){return $('#dr').classList.contains('on')?$('#pn'):$('#review-detail')}
function draftSave(id){const el=activeReview()?.querySelector('#draftbody');if(el)try{localStorage.setItem(LS+'-draft-'+id,JSON.stringify(el.value))}catch(e){}}
function navHTML(a){const icons={avui:'inbox',confirmacions:'check',produccio:'factory',aprovacions:'check',comandes:'list',mes:'more'};return a.map(([k,t])=>`<a role="button" tabindex="0" class="${state.route===k?'on':''}" onclick="go('${k}')" onkeydown="if(event.key==='Enter')go('${k}')"><span class="navicon">${icon(icons[k])}</span>${k==='avui'?'Seguiment':k==='aprovacions'?'Decisions':t}${k==='avui'?`<span class="n">${SEG.sups.filter(x=>x.over.length).length}</span>`:''}</a>`).join('')}
function icon(k){const paths={inbox:'M3 4h18v15H3z M3 12h5l2 3h4l2-3h5',factory:'M3 21V9l6 4V9l6 4V3h4v18z M7 17h1m3 0h1m3 0h1',check:'M8 4h12v17H4V4h4 M8 3h8v4H8z M8 14l3 3 5-6',list:'M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1',more:'M4 6h16M4 12h16M4 18h16'};return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[k]||paths.list}"/></svg>`}
function nav(){ $('#side').innerHTML=`<div class="brand"><img src="${C.logo}" alt="${C.name}"><small>ESPAI DE COMPRES</small></div><div class="nav-section">OPERACIONS</div>${navHTML(C.nav)}<div class="side-foot"><div class="identity"><span class="avatar">${esc(C.contact[0])}</span><div>${esc(C.contact)}<br><span class="mut">Entorn de demostració</span></div></div><div class="independent">Demo independent · Dades fictícies<br>No connectada al correu ni a l'ERP</div></div>`;$('#mob').innerHTML=navHTML(C.nav);}
function queueRows(){return C.aps.filter(a=>(queueMode==='done'?!!D[a.id]:!D[a.id])&&(queueMode!=='urgent'||a.urg)&&(!queueQ||(a.title+' '+a.order+' '+a.type+' '+(ord(a.order)?sup(ord(a.order).s).n:'')).toLowerCase().includes(queueQ.toLowerCase())))}
function queueFilter(mode){queueMode=mode;selectedAp=null;vAvui()}
function vAvui(){const pend=C.aps.filter(a=>!D[a.id]),urgent=pend.filter(a=>a.urg);let rows=queueRows();if(!rows.some(a=>a.id===selectedAp))selectedAp=rows[0]?.id;
 $('#view').innerHTML=`<div class="heading headrow"><div><div class="eyebrow">COMPRES / EXCEPCIONS</div><h1>Per revisar</h1><div class="sub">${C.key==='galan'?'Materials i dates que afecten la fabricació.':C.key==='cytecma'?'Components crítics i documentació pendent.':'Compres i canvis pendents per projecte.'}</div></div><span class="snapshot">Exemple fictici · ${fmtD(C.today)}</span></div><div class="public-context"><div><b>Compres i administració, en un mateix cas.</b><p>Exemple fictici: entrega parcial, peces pendents i factura per revisar. Sense correu ni ERP connectats.</p><a href="https://femdeo.cat/cristina-camps/" target="_blank" rel="noopener">Entrevista pública · Cristina Camps ↗</a></div><button class="btn ghost" onclick="go('expedient')">Veure un cas pas a pas →</button></div><div class="queue-tabs"><button class="${queueMode==='pending'?'on':''}" onclick="queueFilter('pending')">Pendents <b>${pend.length}</b></button><button class="${queueMode==='urgent'?'on':''}" onclick="queueFilter('urgent')">Prioritaris <b>${urgent.length}</b></button><button class="${queueMode==='done'?'on':''}" onclick="queueFilter('done')">Resolts <b>${C.aps.length-pend.length}</b></button><span class="queue-note">Aprovació manual · Sense enviaments</span></div><div class="workbench"><section class="queue"><div class="queue-search"><input type="search" aria-label="Cerca incidències" placeholder="Cerca comanda o proveïdor…" value="${esc(queueQ)}" oninput="queueQ=this.value;refreshQueue()"></div><div id="queue-list"></div></section><section class="detail" id="review-detail"></section></div>`;
 refreshQueue(false);if(selectedAp&&!matchMedia('(max-width:900px)').matches)selectAp(selectedAp);else $('#review-detail').innerHTML='<div class="blank"><h2>Cap incidència en aquesta vista</h2><p>Canvia el filtre per veure la resta de propostes.</p></div>';
}
function refreshQueue(auto=true){const rows=queueRows();$('#queue-list').innerHTML=rows.map(a=>{const o=ord(a.order);return `<button class="queue-row ${selectedAp===a.id?'selected':''}" onclick="selectAp('${a.id}')"><div class="queue-meta"><span>${esc(a.order)}</span><span class="priority ${a.urg?'urgent':''}">${D[a.id]?'Resolta':a.urg?'Prioritari':esc(a.type)}</span></div><strong>${esc(a.title)}</strong><div class="queue-supplier">${o?esc(sup(o.s).n):'Coordinació interna'}</div><div class="queue-brief">${esc(a.brief)}</div><div class="queue-bottom">${o?.proj?esc(o.proj):a.of?esc(a.of):esc(a.type)}<span>Revisar →</span></div></button>`}).join('')||'<div class="empty">Cap coincidència.</div>';if(auto&&rows.length&&!rows.some(a=>a.id===selectedAp))selectAp(rows[0].id)}
function selectAp(id){selectedAp=id;openAp(id);if(matchMedia('(max-width:900px)').matches){refreshQueue(false);return}const html=$('#pn').innerHTML;closeDr();$('#pn').innerHTML='';$('#review-detail').innerHTML=`<div class="detail-toolbar"><span>FITXA DE REVISIÓ</span><span>Comanda → Proposta → Decisió</span></div><div class="detail-body">${html}</div>`;$('#review-detail .x')?.remove();refreshQueue(false)}
const oldOpenAp=openAp;
openAp=function(id){oldOpenAp(id);const a=C.aps.find(x=>x.id===id),d=D[id],tb=$('#pn #draftbody');$('#pn .x')?.setAttribute('aria-label','Tanca la fitxa');
 if(tb){tb.setAttribute('aria-label','Cos del correu');tb.value=d?.body??draftGet(id)??a.draft.body;tb.textContent=tb.value;tb.setAttribute('oninput',`draftSave('${id}')`)}
 $('#pn').querySelectorAll('.act button').forEach(b=>{if(b.textContent.includes('Aprova amb'))b.remove();else if(b.textContent.startsWith('Aprova'))b.textContent='Aprova la proposta'});
 if(a.opts&&!d){$('#pn').querySelectorAll('input[name=opt]').forEach(r=>{r.checked=false;r.removeAttribute('checked');r.setAttribute('onchange',`chooseOption('${id}',this.value)`)});}

 h+=`<h3 style="margin-top:16px">Un sol correu · <span id="segn">${sel.length}</span> comandes</h3><div class="mailprev"><div class="mh">Per a: ${esc(x.c)} · ${esc(x.n)}<br>Assumpte: Comandes vençudes (${sel.length})</div><textarea id="segtxt" style="height:210px" oninput="segEdited=true">${esc(segBody(x))}</textarea></div><div class="act" style="margin-top:10px"><button class="btn" onclick="segCopy()">Copia el text</button><button class="btn soft" onclick="segMark()">Marca com a reclamat</button></div><div class="small mut" style="margin-top:8px">Simulació: no s'envia res.</div>`;
 $('#pn').innerHTML=h;$('#dr').classList.add('on')}
function segRefresh(){const x=SEG.sups.find(v=>v.id===segSel);const t=document.querySelector('#segtxt');const n=segList(x).filter(o=>segChecked[o.id]!==false).length;document.querySelector('#segn').textContent=n;if(t&&!segEdited)t.value=segBody(x)}
function segCopy(){const t=document.querySelector('#segtxt');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>toast('Text copiat'),()=>{t.select();document.execCommand('copy');toast('Text copiat')})}else{t.select();document.execCommand('copy');toast('Text copiat')}}
function segMark(){segDone[segSel]=true;closeDr();toast('Marcat com a reclamat (simulat)');vAvui()}

/* ---------- CONFIRMACIONS AMB DIFERÈNCIES ---------- */
const CNF=(function(){
 let seed=777;const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const alt={'CIL-CP-32':'CIL-CP-40','VAL-5/2-24V':'VAL-5/2-12V','SEN-IND-M12':'SEN-IND-M18','CRG-M6':'CRG-M6 inox','PER-45':'PER-40','SRV-400W':'SRV-750W','XAP-3':'XAP-4','CON-M12':'CON-M8','CAB-3G25':'CAB-3G15','PLA-P-07':'PLA-P-07 rev.B'};
 const keys=Object.keys(alt);const out=[];let ref=512;
 const tipus=['plazo','preu','material','quantitat'];
 for(let i=0;i<64;i++){
  const sp=SEG.sups[Math.floor(R()*SEG.sups.length)];
  const rr=R();const t=rr<.4?'plazo':rr<.68?'preu':rr<.88?'material':'quantitat';
  const k=keys[Math.floor(R()*keys.length)];
  const base=Date.parse('2026-12-02')+Math.floor(R()*40)*864e5;
  const o={id:'PC-26-'+String(ref+i*3).padStart(4,'0'),sp,t,r:k,rec:Date.parse('2026-11-'+String(10+Math.floor(R()*9)))};
  if(t==='plazo'){const d=7+Math.floor(R()*5)*7;o.ped=fd(base);o.conf=fd(base+d*864e5);o.d='+'+d+' dies'}
  if(t==='preu'){const p=[3,5,8,12,15][Math.floor(R()*5)];o.ped='100 %';o.conf=(100+p)+' %';o.d='+'+p+' %'}
  if(t==='material'){o.ped=k;o.conf=alt[k];o.d='Altra referència'}
  if(t==='quantitat'){const q=[10,20,40,50][Math.floor(R()*4)];const c=Math.round(q*[.5,.6,.8][Math.floor(R()*3)]);o.ped=q+' u.';o.conf=c+' u.';o.d='-'+(q-c)+' u.'}
  out.push(o);
 }
 return {rows:out,rebudes:238};
})();
let cnfT='',cnfSel=null,cnfDone={};
const CNFL={plazo:'Termini',preu:'Preu',material:'Material',quantitat:'Quantitat'};
function vConfirmacions(){
 const rows=CNF.rows.filter(o=>!cnfT||o.t===cnfT);const c=t=>CNF.rows.filter(o=>o.t===t).length;
 let h=`<div class="heading headrow"><div><div class="eyebrow">COMPRES</div><h1>Confirmacions amb diferències</h1></div><div class="small mut">Dades fictícies</div></div>`;
 h+=`<div class="grid k4">${kpi('Confirmacions rebudes',CNF.rebudes)}${kpi('Amb diferències',CNF.rows.length,'bad')}${kpi('Termini',c('plazo'),'warn')}${kpi('Preu',c('preu'),'warn')}</div>`;
 h+=`<div class="card" style="margin-top:14px;padding:0"><div style="display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap">${[['','Totes'],['plazo','Termini'],['preu','Preu'],['material','Material'],['quantitat','Quantitat']].map(([k,l])=>`<button class="chip ${cnfT===k?'on':''}" onclick="cnfT='${k}';vConfirmacions()">${l}</button>`).join('')}</div><div style="overflow:auto"><table><thead><tr><th>Proveïdor</th><th>Comanda</th><th>Diferència</th><th>Comanda diu</th><th>Confirmació diu</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr style="cursor:pointer" onclick="cnfOpen('${o.id}')"><td><b>${esc(o.sp.n)}</b></td><td>${o.id}</td><td><span class="tag ${o.t==='preu'||o.t==='material'?'t-red':'t-amb'}">${CNFL[o.t]}</span></td><td>${esc(o.ped)}</td><td><b>${esc(o.conf)}</b> <span class="small mut">${esc(o.d)}</span></td><td style="text-align:right">${cnfDone[o.id]?'<span class="tag t-grn">'+cnfDone[o.id]+'</span>':'<button class="btn soft" onclick="event.stopPropagation();cnfOpen(\''+o.id+'\')">Revisar</button>'}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('#view').innerHTML=h}
function cnfBody(o){const q=o.t==='plazo'?`la confirmació indica entrega ${o.conf} i la comanda deia ${o.ped}`:o.t==='preu'?`el preu confirmat és un ${o.d} superior al de la comanda`:o.t==='material'?`la confirmació indica ${o.conf} i la comanda demanava ${o.ped}`:`la confirmació serveix ${o.conf} i vam demanar ${o.ped}`;
 return `Bon dia ${o.sp.c},\n\nHem rebut la confirmació de la comanda ${o.id} (${o.r}) i no coincideix amb la nostra comanda: ${q}.\n\nEns podeu confirmar si és correcte o mantenir les condicions de la comanda?\n\nGràcies,\nCristina\nCMTEC (demo)`}
function cnfOpen(id){cnfSel=CNF.rows.find(o=>o.id===id);const o=cnfSel;
 $('#pn').innerHTML=`<button class="x" onclick="closeDr()">×</button><h2 style="margin:0 0 2px">${o.id} · ${esc(o.sp.n)}</h2><div class="small mut" style="margin-bottom:12px">${esc(o.r)}</div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><div class="small mut">Comanda</div><h2 style="margin:4px 0 0">${esc(o.ped)}</h2></div><div class="card" style="border-color:#e0b4b0"><div class="small mut">Confirmació del proveïdor</div><h2 style="margin:4px 0 0;color:#b42318">${esc(o.conf)}</h2></div></div><h3 style="margin-top:16px">Correu al proveïdor</h3><div class="mailprev"><div class="mh">Per a: ${esc(o.sp.c)} · ${esc(o.sp.n)}</div><textarea id="cnftxt" style="height:200px">${esc(cnfBody(o))}</textarea></div><div class="act" style="margin-top:10px"><button class="btn" onclick="cnfCopy()">Copia el text</button><button class="btn soft" onclick="cnfMark('Acceptat')">Accepta el canvi</button><button class="btn soft" onclick="cnfMark('Reclamat')">Marca com a reclamat</button></div><div class="small mut" style="margin-top:8px">Simulació: no s'envia res.</div>`;$('#dr').classList.add('on')}
function cnfCopy(){const t=document.querySelector('#cnftxt');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>toast('Text copiat'),()=>{t.select();document.execCommand('copy');toast('Text copiat')})}else{t.select();document.execCommand('copy');toast('Text copiat')}}
function cnfMark(x){cnfDone[cnfSel.id]=x;closeDr();toast(x+' (simulat)');vConfirmacions()}
